name: lucena
description: "Chess endgame trainer: play endgames against Maia-3 or Stockfish."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.13.3

dependencies:
  chessground: ^10.3.0
  dartchess: ^0.14.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  multistockfish: ^0.6.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  patrol: ^4.10.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^4.0.1
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  shared_preferences_platform_interface: ^2.4.2
  drift_dev: ^2.35.1

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/branding/mascot_light.png
    - assets/branding/mascot_dark.png
    - assets/positions/positions.json
    - assets/progression/ladder.json
    - assets/progression/speedruns.json
    - assets/progression/time_controls.json
    - assets/achievements.json
    - assets/characters/
    - assets/characters/youngster/
    - assets/characters/snob/
    - assets/characters/prodigy/
    - assets/characters/master/
    - assets/characters/magician/
    - assets/characters/grandpa/
    - assets/characters/foodie/
    - assets/characters/bodybuilder/
    - assets/characters/beachgoer/
    - assets/lines/en/
    - assets/lines/pt/
    # Pesos do Maia-3 (tools/maia/export_weights.py)
    - assets/models/maia3-5m.bin

  fonts:
    # Peças de xadrez para a notação figurina (tools/make_figurine_font.py)
    - family: LucenaFigurine
      fonts:
        - asset: assets/fonts/LucenaFigurine.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/launcher_icon.png
  adaptive_icon_background: "#14211B"
  adaptive_icon_foreground: assets/branding/launcher_icon_foreground.png

patrol:
  app_name: Lucena
  test_directory: integration_test
  android:
    package_name: com.gncortes.lucena
