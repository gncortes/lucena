name: Flutter
description: Java, Flutter na versão fixa do projeto e dependências.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    # Mesma versão usada no desenvolvimento local (`flutter --version`).
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: 3.47.4
        cache: true

    - name: Dependências
      shell: bash
      run: flutter pub get
