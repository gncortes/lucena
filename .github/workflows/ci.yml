name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Chamado pelo release.yml antes de publicar.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sem segredos aqui: este workflow roda também em PRs de forks.
permissions:
  contents: read

jobs:
  checks:
    name: Formatação, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      # Reprova se algum idioma estiver sem chave do inglês ou se houver texto fixo em widget.
      - name: Traduções
        run: python3 tools/check_l10n.py

      - name: Falas dos personagens
        run: python3 tools/check_lines.py

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

  apk:
    name: Build do APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      # Só confere que o build de release compila (assinado com a chave de debug).
      # O APK para instalar vem do workflow QA (App Distribution) ou da Release.
      - name: Build
        run: flutter build apk --release
