name: Landing page

# Site estático em landing/ (Astro), publicado no GitHub Pages.
# PR: só confere o build. main: publica. Manual (workflow_dispatch) numa
# branch: publica a prévia dessa branch no mesmo endereço.
on:
  pull_request:
    branches: [main, develop]
    paths: ['landing/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Tipos
        working-directory: landing
        run: npm ci && npx astro check

      - name: Build e artefato do Pages
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: landing

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
