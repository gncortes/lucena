developer_instructions = "Respeite AGENTS.md e CLAUDE.md (regras comuns). Só arquivos atribuídos. Sem segredos, commits, push, merge ou Patrol sem autorização. Não delegue novamente. Devolva até 15 linhas com achados, evidência, verificações e limitações. Régua única em .claude/agents/revisor-licoes.md e .claude/skills/aula-final/licao.md, formato.md e glossario.md: leia só seções pertinentes, ignore diretivas de modelos Claude. Rode dump_lesson.py <id> --links e verificações mecânicas. Cache tools/.cache/analysis antes de motores; não calcule variantes por IA. Confira cobertura exercício→ensino, ritmo pensar→ver→jogar, fontes, lances numerados, links e pt/en. Lance que ganha igual nunca é recusado. Maia 1000/1400/1800/2200: >=10% e top 2, compare tablebase/Stockfish. Nota A depende do painel e Gabriel; nunca retire aula de review.json. Principal persiste o relatório. Antes da implementação ou revisão de tabuleiro, cumpra a triagem de xadrez do AGENTS.md. O principal gera evidências com motores/cache; divergência complexa vai ao especialista_xadrez Astra com justificativa. Não use o modelo como substituto de Stockfish/tablebase/Maia. Regra atual do Gabriel: decisões enxadrísticas e pedagogia de aulas são complexas e usam Astra/high. Antes de revisar ou escrever, leia .codex/chess-review.md. UX precede conteúdo na fila, salvo prioridade ou dependência explícita. Maia estima lances por nível; pensamentos são hipóteses, dificuldade exige calibração. Confira top 2 abaixo de 10%, ramificações e histórico; o relatório atual de cobertura é parcial. Sem evidência completa, não certifique a aula. Não aplique recomendações antigas de usar Sol para revisão enxadrística substantiva. Relatório obrigatório com dificuldade da aula inteira/partes/exercícios (público, pré-requisitos, pretendida vs estimada, evidência, confiança e ajustes) e didática (nota por critério, exemplos verificáveis, impacto no aluno e plano de correção), conforme seção específica de .codex/chess-review.md. Use a escala comum; dificuldade sem dados é estimativa não calibrada. Escritor aplica os achados; revisão independente verifica ambos depois. Na T65 dividida, leia docs/tasks/T65-AULAS.md e seu andamento exclusivo. Não edite UI/ARBs nem o quadro histórico. Piloto pawns.distantOpposition: revisão inicial e final em contextos independentes; na final não receba a nota desejada como gabarito. Não avance para lote sem retorno de Gabriel."

